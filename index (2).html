<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revision Hub</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
  :root {
    --bg: #f6f7fb; --card: #ffffff; --text: #1c2434; --muted: #667085;
    --line: #e4e7ec; --accent: #4f46e5; --accent-soft: #eef2ff; --danger: #b42318;
    --ok: #067647; --ok-soft: #ecfdf3; --bad-soft: #fef3f2; --warn: #93370d; --warn-soft: #fef0c7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1420; --card: #18202f; --text: #e8ecf4; --muted: #9aa4b5;
      --line: #2a3447; --accent: #818cf8; --accent-soft: #232b45; --danger: #f97066;
      --ok: #47cd89; --ok-soft: #10261c; --bad-soft: #2c1715; --warn: #fdb022; --warn-soft: #2e2310;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 14px 20px; }
  header .inner { max-width: 960px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .logo { font-weight: 800; font-size: 20px; color: var(--accent); text-decoration: none; }
  main { max-width: 960px; margin: 0 auto; padding: 20px; }
  #crumbs { font-size: 14px; color: var(--muted); margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 6px; }
  #crumbs a { color: var(--accent); text-decoration: none; }
  #crumbs a:hover { text-decoration: underline; }
  #crumbs .here { color: var(--text); font-weight: 600; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .muted { color: var(--muted); }
  .note { font-size: 13px; color: var(--muted); margin: 0 0 14px; }
  .linkbtn { background: none; border: 0; color: var(--accent); font: inherit; cursor: pointer; padding: 0; text-decoration: underline; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .card {
    display: block; background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px; text-decoration: none; color: inherit; transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card-title { font-weight: 700; font-size: 17px; margin-bottom: 6px; }
  .card-meta { color: var(--muted); font-size: 14px; }
  .big .card { padding: 28px 22px; }
  .big .card-title { font-size: 24px; }
  .btn-row { margin: 0 0 18px; }
  .pill {
    display: inline-block; background: var(--accent-soft); color: var(--accent);
    padding: 8px 14px; border-radius: 999px; text-decoration: none; font-weight: 600; font-size: 14px;
  }
  button.pill { border: 0; cursor: pointer; font-family: inherit; }
  .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
  select {
    padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-size: 14px;
  }
  .q { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .badge { background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .chip.correct, .chip.done { background: var(--ok-soft); color: var(--ok); }
  .chip.wrong { background: var(--bad-soft); color: var(--danger); }
  .chip.review { background: var(--warn-soft); color: var(--warn); }
  .qtext { white-space: pre-wrap; font-size: 16px; word-break: break-word; }
  .qimg { max-width: 100%; height: auto; margin-top: 12px; border-radius: 8px; border: 1px solid var(--line); }
  .opts { margin-top: 12px; display: grid; gap: 8px; }
  .opt { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; word-break: break-word; }
  .opt img { display: block; max-width: 100%; height: auto; margin-top: 8px; border-radius: 6px; }
  button.opt { display: block; width: 100%; text-align: left; background: var(--card); color: inherit; font: inherit; cursor: pointer; }
  button.opt:hover:not(.locked) { border-color: var(--accent); }
  button.opt.locked { cursor: default; }
  .opt.correct { border-color: var(--ok); background: var(--ok-soft); }
  .opt.wrong { border-color: var(--danger); background: var(--bad-soft); }
  .opt .tag { float: right; font-weight: 700; font-size: 13px; margin-left: 10px; }
  .opt.correct .tag { color: var(--ok); }
  .opt.wrong .tag { color: var(--danger); }
  .feedback { margin-top: 12px; }
  .verdict { font-weight: 700; }
  .verdict.ok { color: var(--ok); }
  .verdict.bad { color: var(--danger); }
  .expl { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 8px 12px; border-radius: 6px; margin-top: 8px; white-space: pre-wrap; word-break: break-word; }
  .expl-title { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 2px; }
  .selfmark { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  .sm-btn { border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 7px 12px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .sm-btn.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .empty { background: var(--card); border: 1px dashed var(--line); border-radius: 14px; padding: 28px; text-align: center; color: var(--muted); }
  .error { background: var(--card); border: 1px solid var(--danger); color: var(--danger); border-radius: 14px; padding: 18px; }
  @media (max-width: 520px) {
    main { padding: 14px; }
    h1 { font-size: 22px; }
  }
</style>
</head>
<body>
<header>
  <div class="inner">
    <a class="logo" href="#/">Revision Hub</a>
  </div>
</header>
<main>
  <nav id="crumbs"></nav>
  <div id="app"><p class="muted">Loading...</p></div>
</main>

<script>
/* Shows a clear message if one of the page's own files fails, instead of a blank page */
window.addEventListener("error", function (e) {
  var t = e.target, msg;
  if (t && t !== window && (t.src || t.href)) msg = "Could not load this file: " + (t.src || t.href);
  else {
    if (e.filename && e.filename.indexOf(location.origin) !== 0 && e.filename.indexOf("cdn.jsdelivr.net") === -1) return;
    msg = "Error: " + e.message + " (" + (e.filename || "") + " line " + (e.lineno || "?") + ")";
  }
  var box = document.createElement("pre");
  box.style.cssText = "background:#fee;color:#900;padding:12px;margin:12px;white-space:pre-wrap;font-size:13px";
  box.textContent = msg;
  document.body.prepend(box);
}, true);
</script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/mhchem.min.js"></script>
<script src="rich.js"></script>
<script src="parts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://ovescrsrikwonurarbbl.supabase.co";
const SUPABASE_KEY = "sb_publishable_TxKpFdVrHZJ0yMwYTl9RHQ_xgb4wo_o";

const app = document.getElementById("app");
const crumbs = document.getElementById("crumbs");

/* ---------- small helpers ---------- */
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "class") e.className = v;
    else e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    e.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return e;
}
const plural = (n, word) => n + " " + word + (n === 1 ? "" : "s");

function setCrumbs(parts) {
  crumbs.replaceChildren();
  parts.forEach((p, i) => {
    if (i > 0) crumbs.append(h("span", {}, "›"));
    crumbs.append(p.href ? h("a", { href: p.href }, p.label) : h("span", { class: "here" }, p.label));
  });
}
function card(href, title, meta) {
  return h("a", { class: "card", href }, h("div", { class: "card-title" }, title), h("div", { class: "card-meta" }, meta));
}
function safeImage(url) {
  return typeof url === "string" && url.startsWith(SUPABASE_URL + "/storage/");
}
function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- check that the supporting files loaded ---------- */
const missing = [];
if (typeof supabase === "undefined") missing.push("the Supabase library (check your internet connection)");
if (typeof Rich === "undefined") missing.push("rich.js");
else if (typeof Rich.renderOpen !== "function") missing.push("parts.js");
if (missing.length) {
  setCrumbs([{ label: "Home" }, { label: "Error" }]);
  app.replaceChildren(h("div", { class: "error" },
    "The page couldn't start because this didn't load: " + missing.join(", ") + ". " +
    "Check that these files exist in the repository with exactly these names (all lowercase), then hard refresh."));
  throw new Error("Missing: " + missing.join(", "));
}

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ---------- progress (saved in this browser only) ---------- */
const PROG_KEY = "rh_progress_v1";
let progress = {};
try { progress = JSON.parse(localStorage.getItem(PROG_KEY) || "{}") || {}; } catch (e) { progress = {}; }
function saveProgress() { try { localStorage.setItem(PROG_KEY, JSON.stringify(progress)); } catch (e) {} }
function setStatus(id, s) { progress[id] = s; saveProgress(); }
const statusOf = id => progress[id] || null;
const isDone = id => progress[id] === "correct" || progress[id] === "done";
const STATUS_LABEL = { correct: "✓ Correct", done: "✓ Done", wrong: "✗ Got it wrong", review: "⚑ Needs review" };
function qmeta(total, done) { return plural(total, "question") + (done ? " · " + done + " done" : ""); }
function doneWhere(d, pred) { return d.raw.filter(q => pred(q) && isDone(q.id)).length; }

/* ---------- loading data ---------- */
async function fetchAll(table, columns) {
  let all = [], from = 0;
  const size = 1000;
  while (true) {
    const { data, error } = await db.from(table).select(columns).order("id").range(from, from + size - 1);
    if (error) throw error;
    all = all.concat(data);
    if (data.length < size) break;
    from += size;
  }
  return all;
}

let cache = null;
async function loadData() {
  if (cache) return cache;
  const [subjects, topics, subtopics, raw] = await Promise.all([
    fetchAll("subjects", "id,name,papers"),
    fetchAll("topics", "id,subject_id,name,sort_order"),
    fetchAll("subtopics", "id,topic_id,name,sort_order"),
    fetchAll("questions", "id,subject_id,topic_id,subtopic_id")
  ]);
  const byOrder = (a, b) => (a.sort_order - b.sort_order) || (a.id - b.id);
  topics.sort(byOrder);
  subtopics.sort(byOrder);
  const count = { subject: {}, topic: {}, subtopic: {}, direct: {} };
  const add = (obj, key) => { obj[key] = (obj[key] || 0) + 1; };
  for (const q of raw) {
    add(count.subject, q.subject_id);
    if (q.topic_id) add(count.topic, q.topic_id);
    if (q.subtopic_id) add(count.subtopic, q.subtopic_id);
    else if (q.topic_id) add(count.direct, q.topic_id);
  }
  cache = { subjects, topics, subtopics, count, raw };
  return cache;
}

/* ---------- pages ---------- */
function notFound() {
  setCrumbs([{ label: "Home", href: "#/" }, { label: "Not found" }]);
  app.replaceChildren(h("div", { class: "empty" }, "That page doesn't exist (it may have been removed). ", h("a", { href: "#/" }, "Go to the homepage")));
}

function renderHome(d) {
  setCrumbs([{ label: "Home" }]);
  const clearBtn = h("button", { class: "linkbtn", type: "button" }, "Clear my saved progress");
  clearBtn.addEventListener("click", () => {
    if (confirm("Clear all your saved progress on this device? This can't be undone.")) {
      progress = {}; saveProgress(); route();
    }
  });
  app.replaceChildren(
    h("h1", {}, "Choose a subject"),
    h("p", { class: "sub" }, "Pick a subject to start revising."),
    h("div", { class: "grid big" },
      d.subjects.map(s => card("#/s/" + s.id, s.name,
        plural(d.topics.filter(t => t.subject_id === s.id).length, "topic") + " · " +
        qmeta(d.count.subject[s.id] || 0, doneWhere(d, q => q.subject_id === s.id))))),
    h("p", { class: "note", style: "margin-top:24px" }, "Your progress is saved in this browser on this device only. ", clearBtn)
  );
}

function renderSubject(d, id) {
  const s = d.subjects.find(x => x.id === id);
  if (!s) return notFound();
  const topics = d.topics.filter(t => t.subject_id === id);
  setCrumbs([{ label: "Home", href: "#/" }, { label: s.name }]);
  app.replaceChildren(
    h("h1", {}, s.name),
    h("p", { class: "sub" }, "Choose a topic."),
    topics.length
      ? h("div", { class: "grid" }, topics.map(t => card("#/t/" + t.id, t.name,
          plural(d.subtopics.filter(x => x.topic_id === t.id).length, "subtopic") + " · " +
          qmeta(d.count.topic[t.id] || 0, doneWhere(d, q => q.topic_id === t.id)))))
      : h("div", { class: "empty" }, "No topics have been added for this subject yet.")
  );
}

function renderTopic(d, id) {
  const t = d.topics.find(x => x.id === id);
  if (!t) return notFound();
  const s = d.subjects.find(x => x.id === t.subject_id);
  const subs = d.subtopics.filter(x => x.topic_id === id);
  const direct = d.count.direct[id] || 0;
  setCrumbs([{ label: "Home", href: "#/" }, { label: s.name, href: "#/s/" + s.id }, { label: t.name }]);
  const page = [h("h1", {}, t.name), h("p", { class: "sub" }, s.name + " · Choose a subtopic.")];
  if (direct > 0) {
    page.push(h("div", { class: "btn-row" }, h("a", { class: "pill", href: "#/tq/" + id }, "Questions placed directly in this topic (" + direct + ")")));
  }
  if (subs.length) {
    page.push(h("div", { class: "grid" }, subs.map(x => card("#/st/" + x.id, x.name,
      qmeta(d.count.subtopic[x.id] || 0, doneWhere(d, q => q.subtopic_id === x.id))))));
  } else if (direct === 0) {
    page.push(h("div", { class: "empty" }, "No subtopics or questions have been added to this topic yet."));
  }
  app.replaceChildren(...page);
}

/* ---------- multiple choice: click an answer, get feedback ---------- */
function mcqBlock(q, changed) {
  const wrap = h("div", {});
  const opts = h("div", { class: "opts" });
  const feedback = h("div", { class: "feedback" });
  const optEls = {};
  let locked = false;
  let tags = [];
  const BTNROW = "display:flex;gap:8px;flex-wrap:wrap;margin-top:10px";

  function reset() {
    locked = false;
    tags.forEach(t => t.remove());
    tags = [];
    Object.values(optEls).forEach(b => { b.classList.remove("correct", "wrong", "locked"); });
    feedback.replaceChildren();
  }
  function tryAgainButton() {
    const b = h("button", { class: "sm-btn", type: "button" }, "Try again");
    b.addEventListener("click", reset);
    return b;
  }
  function explanationBox() {
    if (!(q.explanation || "").trim()) return null;
    const body = h("div", {});
    Rich.render(body, q.explanation, q.tables);
    return h("div", { class: "expl" }, h("div", { class: "expl-title" }, "Explanation"), body);
  }
  function revealCorrect() {
    const right = optEls[q.correct_option];
    if (right) {
      right.classList.add("correct");
      const t = h("span", { class: "tag" }, "✓ Correct answer");
      right.prepend(t); tags.push(t);
    }
    const parts = [h("div", { class: "verdict bad" }, "✗ Not quite. The correct answer is " + q.correct_option + ".")];
    const ex = explanationBox();
    if (ex) parts.push(ex);
    parts.push(h("div", { style: BTNROW }, tryAgainButton()));
    feedback.replaceChildren(...parts);
  }

  function choose(label) {
    if (locked) return;
    locked = true;
    const right = label === q.correct_option;
    Object.values(optEls).forEach(b => b.classList.add("locked"));
    const picked = optEls[label];
    picked.classList.add(right ? "correct" : "wrong");
    const pickTag = h("span", { class: "tag" }, right ? "✓ Correct" : "✗ Your answer");
    picked.prepend(pickTag); tags.push(pickTag);
    if (right) {
      const parts = [h("div", { class: "verdict ok" }, "✓ Correct!")];
      const ex = explanationBox();
      if (ex) parts.push(ex);
      parts.push(h("div", { style: BTNROW }, tryAgainButton()));
      feedback.replaceChildren(...parts);
    } else {
      const show = h("button", { class: "sm-btn", type: "button" }, "Show correct answer");
      show.addEventListener("click", revealCorrect);
      feedback.replaceChildren(
        h("div", { class: "verdict bad" }, "✗ Not quite."),
        h("div", { style: BTNROW }, tryAgainButton(), show));
    }
    setStatus(q.id, right ? "correct" : "wrong");
    changed();
  }

  (q.options || []).forEach(o => {
    const txt = h("span", {});
    Rich.render(txt, o.text || "", [], { allowTables: false });
    const b = h("button", { class: "opt", type: "button" },
      h("strong", {}, (o.label || "") + ". "), txt,
      safeImage(o.image_url) ? h("img", { src: o.image_url, alt: "Option " + (o.label || "") + " image", loading: "lazy" }) : null);
    b.addEventListener("click", () => choose(o.label));
    optEls[o.label] = b;
    opts.append(b);
  });
  wrap.append(h("p", { class: "note", style: "margin:12px 0 0" }, "Click an answer to check it."), opts, feedback);
  return wrap;
}

/* ---------- one question card ---------- */
function questionCard(q, onChange) {
  const c = h("article", { class: "q" });
  const chip = h("span", { class: "badge chip" });
  function refreshChip() {
    const s = statusOf(q.id);
    chip.className = "badge chip" + (s ? " " + s : "");
    chip.textContent = s ? STATUS_LABEL[s] : "";
    chip.style.display = s ? "" : "none";
  }
  const changed = () => { refreshChip(); if (onChange) onChange(); };
  refreshChip();

  c.append(h("div", { class: "badges" },
    h("span", { class: "badge" }, "Paper " + q.paper),
    h("span", { class: "badge" }, q.format === "mcq" ? "Multiple choice" : "Open ended"),
    q.marks !== null && q.marks !== undefined ? h("span", { class: "badge" }, plural(q.marks, "mark")) : null,
    chip
  ));
  const qt = h("div", { class: "qtext" });
  Rich.render(qt, q.question_text || "", q.tables);
  c.append(qt);
  if (safeImage(q.question_image_url)) {
    c.append(h("img", { class: "qimg", src: q.question_image_url, alt: "Question diagram", loading: "lazy" }));
  }

  if (q.format === "open") {
    const body = h("div", {});
    const mark = h("div", { class: "selfmark" });
    const allBtn = h("button", { class: "pill", type: "button", style: "margin-top:14px;display:none" }, "Show all markschemes");
    const gotBtn = h("button", { class: "sm-btn", type: "button" }, "✓ I got it");
    const revBtn = h("button", { class: "sm-btn", type: "button" }, "⚑ Needs review");
    let api = null;
    function drawMark() {
      mark.replaceChildren();
      if (!api || !api.anyOn()) return;
      const s = statusOf(q.id);
      gotBtn.className = "sm-btn" + (s === "done" ? " on" : "");
      revBtn.className = "sm-btn" + (s === "review" ? " on" : "");
      gotBtn.setAttribute("aria-pressed", String(s === "done"));
      revBtn.setAttribute("aria-pressed", String(s === "review"));
      mark.append(h("span", { class: "muted" }, "How did you do?"), gotBtn, revBtn);
    }
    gotBtn.addEventListener("click", () => { setStatus(q.id, "done"); drawMark(); changed(); });
    revBtn.addEventListener("click", () => { setStatus(q.id, "review"); drawMark(); changed(); });
    api = Rich.renderOpen(body, q, {
      safeImage,
      onChange: () => {
        drawMark();
        allBtn.textContent = api.allOn() ? "Hide all markschemes" : "Show all markschemes";
      }
    });
    if (api.count > 1) allBtn.style.display = "";
    allBtn.addEventListener("click", () => api.setAll(!api.allOn()));
    c.append(body, allBtn, mark);
  }

  if (q.format === "mcq" && Array.isArray(q.options) && q.options.length) {
    c.append(mcqBlock(q, changed));
  }
  return c;
}

/* ---------- list of questions with filters, progress filter and shuffle ---------- */
function questionList(qs, subject) {
  const paperSel = h("select", {}, h("option", { value: "" }, "All papers"),
    (subject.papers || []).map(p => h("option", { value: p }, "Paper " + p)));
  const fmtSel = h("select", {}, h("option", { value: "" }, "All formats"),
    h("option", { value: "mcq" }, "Multiple choice"), h("option", { value: "open" }, "Open ended"));
  const progSel = h("select", {}, h("option", { value: "" }, "All questions"),
    h("option", { value: "todo" }, "Not attempted yet"),
    h("option", { value: "review" }, "Needs review"),
    h("option", { value: "done" }, "Completed"));
  const shuffleBtn = h("button", { class: "pill", type: "button" }, "Shuffle");
  const origBtn = h("button", { class: "pill", type: "button", style: "display:none" }, "Original order");
  const counter = h("span", { class: "muted" });
  const list = h("div", {});
  let order = null;
  let shownCount = 0;

  function matchesProgress(q) {
    const s = statusOf(q.id);
    if (!progSel.value) return true;
    if (progSel.value === "todo") return !s;
    if (progSel.value === "done") return s === "correct" || s === "done";
    return s === "wrong" || s === "review";
  }
  function updateCounter() {
    const done = qs.filter(q => isDone(q.id)).length;
    counter.textContent = plural(shownCount, "question") + " shown · " + done + " of " + qs.length + " completed";
  }
  function draw() {
    let shown = qs.filter(q => (!paperSel.value || q.paper === paperSel.value) &&
      (!fmtSel.value || q.format === fmtSel.value) && matchesProgress(q));
    if (order) {
      const pos = new Map(order.map((id, i) => [id, i]));
      shown.sort((a, b) => (pos.has(a.id) ? pos.get(a.id) : 1e9) - (pos.has(b.id) ? pos.get(b.id) : 1e9));
    }
    shownCount = shown.length;
    updateCounter();
    list.replaceChildren(...(shown.length
      ? shown.map(q => questionCard(q, updateCounter))
      : [h("div", { class: "empty" }, qs.length ? "No questions match these filters." : "No questions here yet.")]));
  }
  paperSel.addEventListener("change", draw);
  fmtSel.addEventListener("change", draw);
  progSel.addEventListener("change", draw);
  shuffleBtn.addEventListener("click", () => {
    order = shuffled(qs.map(q => q.id));
    shuffleBtn.textContent = "Shuffle again";
    origBtn.style.display = "";
    draw();
  });
  origBtn.addEventListener("click", () => {
    order = null;
    shuffleBtn.textContent = "Shuffle";
    origBtn.style.display = "none";
    draw();
  });
  draw();
  return h("div", {},
    h("div", { class: "filters" }, paperSel, fmtSel, progSel, shuffleBtn, origBtn),
    h("p", { class: "note" }, counter, " · Progress is saved in this browser on this device only."),
    list);
}

async function renderSubtopic(d, id) {
  const st = d.subtopics.find(x => x.id === id);
  if (!st) return notFound();
  const t = d.topics.find(x => x.id === st.topic_id);
  const s = d.subjects.find(x => x.id === t.subject_id);
  const { data, error } = await db.from("questions").select("*").eq("subtopic_id", id).order("id");
  if (error) throw error;
  setCrumbs([{ label: "Home", href: "#/" }, { label: s.name, href: "#/s/" + s.id },
    { label: t.name, href: "#/t/" + t.id }, { label: st.name }]);
  app.replaceChildren(h("h1", {}, st.name), h("p", { class: "sub" }, s.name + " · " + t.name), questionList(data, s));
}

async function renderTopicQuestions(d, id) {
  const t = d.topics.find(x => x.id === id);
  if (!t) return notFound();
  const s = d.subjects.find(x => x.id === t.subject_id);
  const { data, error } = await db.from("questions").select("*").eq("topic_id", id).is("subtopic_id", null).order("id");
  if (error) throw error;
  setCrumbs([{ label: "Home", href: "#/" }, { label: s.name, href: "#/s/" + s.id },
    { label: t.name, href: "#/t/" + t.id }, { label: "Topic questions" }]);
  app.replaceChildren(h("h1", {}, t.name), h("p", { class: "sub" }, s.name + " · Questions placed directly in this topic"), questionList(data, s));
}

/* ---------- router ---------- */
async function route() {
  app.replaceChildren(h("p", { class: "muted" }, "Loading..."));
  try {
    const d = await loadData();
    const m = (location.hash || "#/").match(/^#\/(s|t|st|tq)\/(\d+)$/);
    if (!location.hash || location.hash === "#/" || location.hash === "#") return renderHome(d);
    if (!m) return notFound();
    const id = Number(m[2]);
    if (m[1] === "s") return renderSubject(d, id);
    if (m[1] === "t") return renderTopic(d, id);
    if (m[1] === "st") return await renderSubtopic(d, id);
    if (m[1] === "tq") return await renderTopicQuestions(d, id);
  } catch (err) {
    console.error(err);
    setCrumbs([{ label: "Home", href: "#/" }, { label: "Error" }]);
    app.replaceChildren(h("div", { class: "error" },
      "Sorry, something went wrong while loading. Check your internet connection and refresh the page. If it keeps happening, tell the site owner."));
  }
}
window.addEventListener("hashchange", route);
route();
</script>
