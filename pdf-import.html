    marks: el.marks, slot: newSlot("q", el.regions), usePic: el.regions.length > 0, ms: null, children: [], warnings: []
  };
  if (!el.children.length && !(el.kind === "intro" && q.parts.length)) {
    const row = ms.rows[elemKey(q, el)];
    if (row) {

      node.ms = { text: msTextOf(row), slot: newSlot("m", [row.region]), usePic: row.needsPicture, total: row.total, totalMax: row.totalMax, rowPic: row.needsPicture };
      if (node.marks == null && row.total != null && !row.totalMax) node.marks = row.total;
      else if (node.marks != null && row.total != null && !row.totalMax && node.marks !== row.total) node.warnings.push("Marks differ: question paper says " + node.marks + ", markscheme says " + row.total + ".");
    } else if (Object.keys(ms.rows).length) node.warnings.push("No markscheme row was found for this part.");
  }

}
function buildOpenItems(parsed, ms, sourceName) {
  const usedKeys = new Set();
  const items = parsed.questions.map(q => {
    const root = makeNode(q.intro, q, ms, usedKeys);
    const parts = q.parts.map(p => makeNode(p, q, ms, usedKeys));
    const it = { type: "open", number: q.number, include: true, dup: false, subtopicId: null, root: root, parts: parts, warnings: q.warnings.slice(), source: sourceName + "#Q" + q.number };
    return it;

}
function buildMcqItems(parsed, key, sourceName) {
  return parsed.questions.map(q => {
    const warnings = q.warnings.slice();
    const correct = key[q.number] || "";
    if (!correct) warnings.push("No answer was found in the markscheme. Choose the correct answer below.");
    const optionsMode = q.optionsMode;
    return {
      type: "mcq", number: q.number, include: true, dup: false, subtopicId: null, marks: 1, correct: correct,
      stem: { text: q.stem.text, cleanText: q.stem.text, raw: q.stem.rawText, slot: newSlot("q", q.stem.regions), usePic: q.stem.regions.length > 0 },
      mode: optionsMode,

}
function sumLeafMarks(nodes) {
  let total = 0, any = false;
  nodes.forEach(n => {
    if (n.children.length) { const r = sumLeafMarks(n.children); if (r.any) { total += r.total; any = true; } }
    else if (n.marks != null && n.marks !== "") { total += Number(n.marks) || 0; any = true; }
  });

}
function safeText(t) {
  t = String(t || "");

}

  return n;
}

/* ---------- reading PDFs in the browser ---------- */
async function openPdf(file) {
  const buf = await file.arrayBuffer();
  return pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
}
async function imageRects(page, vp) {
  try {
    const ol = await page.getOperatorList();
    const O = pdfjsLib.OPS, U = pdfjsLib.Util;
    const imgOps = new Set(["paintImageXObject", "paintInlineImageXObject", "paintImageMaskXObject", "paintJpegXObject", "paintImageXObjectRepeat"]
      .map(n => O[n]).filter(v => v !== undefined));
    let ctm = [1, 0, 0, 1, 0, 0];
    const stack = [], rects = [];
    for (let i = 0; i < ol.fnArray.length; i++) {
      const fn = ol.fnArray[i], args = ol.argsArray[i];
      if (fn === O.save) stack.push(ctm.slice());
      else if (fn === O.restore) { if (stack.length) ctm = stack.pop(); }
      else if (fn === O.transform) ctm = U.transform(ctm, args);
      else if (fn === O.paintFormXObjectBegin) { stack.push(ctm.slice()); if (args && args[0]) ctm = U.transform(ctm, args[0]); }
      else if (fn === O.paintFormXObjectEnd) { if (stack.length) ctm = stack.pop(); }
      else if (imgOps.has(fn)) {
        const m = U.transform(vp.transform, ctm);
        const pts = [[0, 0], [1, 0], [0, 1], [1, 1]].map(p => U.applyTransform(p, m));
        const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
        const r = { x0: Math.min(...xs), x1: Math.max(...xs), y0: Math.min(...ys), y1: Math.max(...ys) };
        if (r.x1 - r.x0 > 4 && r.y1 - r.y0 > 4 && (r.x1 - r.x0) * (r.y1 - r.y0) < 0.8 * vp.width * vp.height) rects.push(r);
      }
    }
    return rects;
  } catch (e) {
    console.warn("Could not look for pictures on a page", e);
    return [];
  }
}
async function extractPages(doc, wantImages, onProgress) {
  const pages = [];
  for (let i = 1; i <= doc.numPages; i++) {
    onProgress(i, doc.numPages);
    const page = await doc.getPage(i);
    const vp = page.getViewport({ scale: 1 });
    const tc = await page.getTextContent();
    const items = [];
    tc.items.forEach(it => {
      if (typeof it.str !== "string") return;
      const t = pdfjsLib.Util.transform(vp.transform, it.transform);
      items.push({ s: it.str, x: t[4], y: t[5], w: it.width * vp.scale, size: Math.hypot(t[2], t[3]) });
    });
    const images = wantImages ? await imageRects(page, vp) : [];
    pages.push({ width: vp.width, height: vp.height, items: items, images: images });
  }
  return pages;
}

/* ---------- pictures: cut regions out of PDF pages ---------- */
const SCALE = 2;
const pageCache = new Map();
async function pageCanvas(doc, key, idx) {
  const ck = key + ":" + idx;
  if (pageCache.has(ck)) { const c = pageCache.get(ck); pageCache.delete(ck); pageCache.set(ck, c); return c; }
  const page = await doc.getPage(idx + 1);
  const vp = page.getViewport({ scale: SCALE });
  const c = document.createElement("canvas");
  c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  pageCache.set(ck, c);
  while (pageCache.size > 3) pageCache.delete(pageCache.keys().next().value);
  return c;
}
function trimCanvas(c) {
  const w = c.width, hh = c.height;
  const data = c.getContext("2d").getImageData(0, 0, w, hh).data;
  let minX = w, minY = hh, maxX = -1, maxY = -1;
  for (let y = 0; y < hh; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      if (data[i] < 235 || data[i + 1] < 235 || data[i + 2] < 235) {
        if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) return null;
  const pad = 8;
  minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
  maxX = Math.min(w - 1, maxX + pad); maxY = Math.min(hh - 1, maxY + pad);
  const o = document.createElement("canvas");
  o.width = maxX - minX + 1; o.height = maxY - minY + 1;
  const octx = o.getContext("2d");
  octx.fillStyle = "#fff"; octx.fillRect(0, 0, o.width, o.height);
  octx.drawImage(c, minX, minY, o.width, o.height, 0, 0, o.width, o.height);
  return o;
}
async function cropRegion(doc, key, rg) {
  const pc = await pageCanvas(doc, key, rg.page);
  const x0 = Math.max(0, Math.floor(rg.x0 * SCALE)), y0 = Math.max(0, Math.floor(rg.y0 * SCALE));
  const x1 = Math.min(pc.width, Math.ceil(rg.x1 * SCALE)), y1 = Math.min(pc.height, Math.ceil(rg.y1 * SCALE));
  const w = x1 - x0, hgt = y1 - y0;
  if (w < 8 || hgt < 8) return null;
  const c = document.createElement("canvas");
  c.width = w; c.height = hgt;
  c.getContext("2d").drawImage(pc, x0, y0, w, hgt, 0, 0, w, hgt);
  return trimCanvas(c);
}
function stackCanvases(cs) {
  if (cs.length === 1) return cs[0];
  const gap = 10;
  const W = Math.max(...cs.map(c => c.width));
  const H = cs.reduce((a, c) => a + c.height, 0) + gap * (cs.length - 1);
  const o = document.createElement("canvas");
  o.width = W; o.height = H;
  const ctx = o.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
  let y = 0;
  cs.forEach(c => { ctx.drawImage(c, 0, y); y += c.height + gap; });

}
const canvasBlob = (c, type, q) => new Promise(res => c.toBlob(res, type, q));
async function toBlob(c) {
  let b = await canvasBlob(c, "image/png");
  if (b && b.size > 1.9 * 1024 * 1024) b = await canvasBlob(c, "image/jpeg", 0.88);
  if (!b || b.size > 1.95 * 1024 * 1024) throw new Error("A picture is too large to store (over 2 MB).");

}
function ensureSlot(slot) {
  if (!slot) return Promise.resolve(null);
  if (slot.promise) return slot.promise;
  slot.promise = (async () => {
    try {
      const doc = slot.src === "m" ? S.mDoc : S.qDoc;
      const cs = [];
      for (const rg of slot.regions) { const c = await cropRegion(doc, slot.src, rg); if (c) cs.push(c); }
      if (!cs.length) throw new Error("The picture area was empty.");
      slot.blob = await toBlob(stackCanvases(cs));
      slot.url = URL.createObjectURL(slot.blob);
      slot.state = "ready";
    } catch (e) {
      console.error("Picture failed", e);
      slot.state = "failed";
      slot.error = friendly(e);
    }
    slot.listeners.forEach(fn => { try { fn(); } catch (e2) { /* ignore */ } });
    return slot;
  })();

}
async function runPreviewQueue(onProgress) {
  const slots = S.slots.slice().sort((a, b) => (a.src < b.src ? -1 : a.src > b.src ? 1 : a.regions[0].page - b.regions[0].page));
  let done = 0;
  for (const slot of slots) {
    if (!S || S.cancelled) return;
    await ensureSlot(slot);
    done++;
    onProgress(done, slots.length);
  }
}
function thumb(slot) {
  const box = h("div", { class: "thumb" });
  if (!slot) return box;
  const msg = h("span", { class: "muted small" }, "Preparing the picture...");
  const img = h("img", { alt: "Picture cut from the PDF", style: "display:none" });

}
async function loadAll() {
  const [subjects, topics, subtopics] = await Promise.all([
    fetchAll("subjects", "id,name,papers"),
    fetchAll("topics", "id,subject_id,name,sort_order"),
    fetchAll("subtopics", "id,topic_id,name,sort_order")
  ]);
  const byOrder = (a, b) => (a.sort_order - b.sort_order) || (a.id - b.id);
  topics.sort(byOrder); subtopics.sort(byOrder);
  meta = { subjects: subjects, topics: topics, subtopics: subtopics };
  existing = await fetchAll("questions", "id,subject_id,paper,format,question_text,source");
}
async function start() {
  if (S) { S.cancelled = true; S.slots.forEach(s => { if (s.url) URL.revokeObjectURL(s.url); }); S = null; }
  pageCache.clear();
  app.replaceChildren(h("p", { class: "muted" }, "Loading..."));
  try { await loadAll(); }
  catch (e) {
    const msg = friendly(e);
    app.replaceChildren(h("div", { class: "error" }, "Could not load data: " + msg +
      (/source/i.test(msg) ? "\n\nThis looks like the database step that adds the \"source\" column has not been run yet. Run the SQL from the instructions in Supabase, then refresh." : "")));
    return;
  }
  showSetup();
}

/* ---------- reading and parsing ---------- */
async function processFiles(cfg, say) {
  S = { cfg: cfg, slots: [], items: [], qDoc: null, mDoc: null, cancelled: false, unusedMs: [], notes: [] };
  const base = cfg.qf.name.replace(/\.pdf$/i, "");
  say("Opening the question paper...");
  S.qDoc = await openPdf(cfg.qf);
  const qPages = await extractPages(S.qDoc, false, (i, n) => say("Reading question paper page " + i + " of " + n + "..."));
  const chars = qPages.reduce((a, p) => a + p.items.reduce((b, it) => b + it.s.length, 0), 0);
  if (chars < 200) throw new Error("This PDF has almost no readable text, so it looks like a scan. Scanned PDFs are not supported yet.");
  let mPages = null;
  if (cfg.mf) {
    say("Opening the markscheme...");
    S.mDoc = await openPdf(cfg.mf);
    mPages = await extractPages(S.mDoc, true, (i, n) => say("Reading markscheme page " + i + " of " + n + "..."));
  }
  say("Finding the questions...");
  if (cfg.format === "mcq") {
    const parsed = PdfParse.parseMcq(qPages);
    const key = mPages ? PdfParse.parseMcqKey(mPages) : {};
    if (mPages && !Object.keys(key).length) S.notes.push("No answer key could be read from the markscheme PDF. You will need to choose each answer yourself.");
    S.items = buildMcqItems(parsed, key, base);
  } else {
    const parsed = PdfParse.parseOpen(qPages);
    const ms = mPages ? PdfParse.parseMarkschemeOpen(mPages) : { rows: {}, order: [] };
    if (mPages && !ms.order.length) S.notes.push("No markscheme rows could be read from the markscheme PDF.");
    const r = buildOpenItems(parsed, ms, base);
    S.items = r.items; S.unusedMs = r.unusedMs;
  }
  if (!S.items.length) throw new Error("No questions were found. Check that you chose the right paper type and the right PDF.");
  // duplicates: same source already imported
  S.items.forEach(it => {
    const dup = existing.find(e => e.source && e.source === it.source);
    if (dup) { it.dup = true; it.include = false; it.warnings.push("Already imported (question #" + dup.id + " in your bank). Tick Include if you really want it again."); }
  });
  showReview();
  runPreviewQueue((d, n) => { const el = document.getElementById("prep"); if (el) el.textContent = d >= n ? "All pictures are ready." : "Preparing pictures: " + d + " of " + n + "..."; });
}

function subtopicSelect(subjectId, value, onChange, extraClass) {
  const sel = h("select", { class: extraClass || "auto" }, h("option", { value: "" }, "Unassigned"));
  meta.topics.filter(t => t.subject_id === subjectId).forEach(t => {
    const og = h("optgroup", { label: t.name.length > 60 ? t.name.slice(0, 57) + "…" : t.name });
    meta.subtopics.filter(x => x.topic_id === t.id).forEach(x => og.append(h("option", { value: String(x.id) }, x.name)));
    sel.append(og);
  });
  sel.value = value ? String(value) : "";
  sel.addEventListener("change", () => onChange(sel.value ? Number(sel.value) : null));
  return sel;
}
function textBox(obj, field, rows) {
  const ta = h("textarea", { rows: String(rows || 3) });
  ta.value = obj[field] || "";
  ta.addEventListener("input", () => { obj[field] = ta.value; });
  return ta;
}
function nodeBlock(n, title, level) {
  const box = h("div", { class: "node", style: "margin-left:" + (level * 14) + "px" });
  box.append(h("div", { class: "row" }, h("strong", {}, title),
    n.children.length ? h("span", { class: "muted small" }, "(has sub-parts)") : null));
  const ta = textBox(n, "text", 3);
  box.append(ta);
  if (n.slot) {
    const chk = h("input", { type: "checkbox" });
    chk.checked = n.usePic;
    const pic = h("div", {});
    const drawPic = () => { pic.replaceChildren(n.usePic ? thumb(n.slot) : h("span", {})); };
    chk.addEventListener("change", () => {
      n.usePic = chk.checked;
      n.text = n.usePic ? n.cleanText : (n.raw || n.cleanText);
      ta.value = n.text;
      drawPic();
    });
    box.append(h("div", { class: "row" }, h("label", { class: "chk" }, chk, "Use the picture of the diagram / equation from the paper"),
      h("span", { class: "muted small" }, "(untick to use the extracted text instead)")), pic);
    drawPic();
  }
  if (!n.children.length) {
    const mi = h("input", { type: "number", min: "0", step: "1", class: "auto tiny" });
    mi.value = n.marks == null ? "" : n.marks;
    mi.addEventListener("input", () => { n.marks = mi.value === "" ? null : Number(mi.value); });
    box.append(h("div", { class: "row" }, h("label", { class: "chk" }, "Marks ", mi)));
  }
  if (n.ms) {
    const ms = n.ms;
    const wrap = h("div", { style: "margin-top:6px" }, h("span", { class: "lbl" }, "Markscheme" + (ms.total != null ? " (total " + ms.total + (ms.totalMax ? ", max" : "") + ")" : "")));
    const area = h("div", {});
    const chk = h("input", { type: "checkbox" });
    chk.checked = ms.usePic;
    const draw = () => {
      if (ms.usePic && ms.slot) area.replaceChildren(thumb(ms.slot));
      else area.replaceChildren(textBox(ms, "text", 4));
    };
    chk.addEventListener("change", () => { ms.usePic = chk.checked; draw(); });
    if (ms.slot) wrap.append(h("div", { class: "row" }, h("label", { class: "chk" }, chk, "Use a picture of the markscheme row"),
      h("span", { class: "muted small" }, ms.rowPic ? "(recommended here: it contains equations)" : "")));
    wrap.append(area);
    box.append(wrap);
    draw();
  }
  n.warnings.forEach(w => box.append(h("div", { class: "small", style: "color:var(--warn)" }, "⚠ " + w)));
  n.children.forEach((c, i) => box.append(nodeBlock(c, (c.kind === "sub" ? "(" + c.label + ")" : "(" + c.label + ")"), level + 1)));
  return box;
}

/* ---------- screen 3: saving ---------- */
async function uploadSlot(slot, uploaded) {
  const s = await ensureSlot(slot);
  if (!s || s.state !== "ready") throw new Error("A picture could not be made (" + (s && s.error ? s.error : "unknown problem") + ").");
  const ext = s.blob.type === "image/png" ? "png" : "jpg";
  const path = crypto.randomUUID() + "." + ext;
  const { error } = await db.storage.from(BUCKET).upload(path, s.blob, { contentType: s.blob.type, upsert: false });
  if (error) throw error;
  const url = db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
  uploaded.push(url);
  return url;
}
function pathOf(u) { const p = String(u).split("/" + BUCKET + "/"); return p.length === 2 ? decodeURIComponent(p[1]) : null; }

async function nodeToPart(n, uploaded) {
  const part = { text: safeText(n.text), marks: n.children.length ? null : (n.marks == null ? null : Number(n.marks)), image_url: null, model_answer: null, marking_scheme: null, parts: [] };
  if (n.usePic && n.slot) part.image_url = await uploadSlot(n.slot, uploaded);
  if (!part.text.trim() && !part.image_url && !n.children.length) part.text = "(see the question paper)";
  if (n.ms) part.marking_scheme = await msString(n.ms, uploaded);
  for (const c of n.children) {
    const sub = await nodeToPart(c, uploaded);
    delete sub.parts;
    part.parts.push(sub);
  }
  if (!n.children.length) delete part.parts;
  return part;
}
async function msString(ms, uploaded) {
  if (ms.usePic && ms.slot) return "[[img:" + await uploadSlot(ms.slot, uploaded) + "]]";
  return safeText(ms.text) || null;
}

async function buildPayload(it, uploaded) {
  const cfg = S.cfg;
  const topic = it.subtopicId ? meta.subtopics.find(x => x.id === it.subtopicId) : null;
  const base = {
    subject_id: cfg.subject.id, topic_id: topic ? topic.topic_id : null, subtopic_id: topic ? topic.id : null,
    paper: cfg.paper, format: it.type, question_image_url: null, status: "draft", source: it.source,
    explanation: null, model_answer: null, marking_scheme: null, parts: [], tables: [], options: [], correct_option: null
  };
  if (it.type === "mcq") {
    base.question_text = safeText(it.stem.text);
    if (it.stem.usePic && it.stem.slot) base.question_image_url = await uploadSlot(it.stem.slot, uploaded);
    base.marks = it.marks == null ? null : Number(it.marks);
    base.correct_option = it.correct;
    for (const o of it.options) {
      let text = "", image_url = null;
      if (it.mode === "picture") image_url = await uploadSlot(o.slot, uploaded);
      else text = safeText(o.text);
      base.options.push({ label: o.label, text: text, image_url: image_url });
    }
    if (it.mode === "placeholder") base.options = ["A", "B", "C", "D"].map(l => ({ label: l, text: "(see the picture)", image_url: null }));
    if (!base.question_text.trim() && !base.question_image_url) base.question_text = "(see the question paper)";
    return base;
  }
  // open ended
  const root = it.root;
  base.question_text = safeText(root.text);
  if (root.usePic && root.slot) base.question_image_url = await uploadSlot(root.slot, uploaded);
  if (!it.parts.length) {
    base.marks = root.marks == null ? null : Number(root.marks);
    if (root.ms) base.marking_scheme = await msString(root.ms, uploaded);
  } else {
    for (const p of it.parts) base.parts.push(await nodeToPart(p, uploaded));
    const sm = sumLeafMarks(it.parts);
    base.marks = sm.any ? sm.total : null;
  }
  if (!base.question_text.trim() && !base.question_image_url) base.question_text = "(see the parts below)";
  return base;
}

async function doImport() {
  const chosen = S.items.filter(i => i.include);
  const progress = h("p", {}, "Starting...");
  app.replaceChildren(h("div", { class: "panel" }, h("h1", {}, "Importing..."), progress, h("p", { class: "muted small" }, "Please keep this page open.")));
  const ok = [], failed = [];
  let pics = 0;
  for (let i = 0; i < chosen.length; i++) {
    const it = chosen[i];
    progress.textContent = "Saving question " + it.number + " (" + (i + 1) + " of " + chosen.length + ")...";
    const uploaded = [];
    try {
      const payload = await buildPayload(it, uploaded);
      const res = await db.from("questions").insert(payload).select("id");
      if (res.error) throw res.error;
      if (!res.data || res.data.length !== 1) throw new Error("The database did not confirm this question.");
      pics += uploaded.length;
      ok.push(it.number);
    } catch (e) {
      console.error(e);
      const paths = uploaded.map(pathOf).filter(Boolean);
      if (paths.length) { try { await db.storage.from(BUCKET).remove(paths); } catch (e2) { /* ignore */ } }
      failed.push({ n: it.number, msg: friendly(e) });
    }
  }
  const skipped = S.items.length - chosen.length;
  const noTopic = chosen.filter(i => ok.includes(i.number) && !i.subtopicId).length;
  const rows = [["Questions found in the PDF", S.items.length], ["Imported as drafts", ok.length], ["Not selected (skipped)", skipped],
    ["Failed", failed.length], ["Pictures saved", pics], ["Imported without a topic", noTopic]];
  const again = h("button", { class: "btn", type: "button" }, "Import another PDF");
  again.addEventListener("click", start);
  app.replaceChildren(h("div", { class: "panel" },
    h("h1", {}, failed.length ? "Import finished with problems" : "Import finished"),
    failed.length ? h("div", { class: "error" }, "These questions were NOT imported:\n" + failed.map(f => "Question " + f.n + ": " + f.msg).join("\n") + "\n\nThe others are saved. To retry, start over: questions already imported will be marked so they are not added twice.")
      : h("div", { class: "okbox" }, plural(ok.length, "question") + " saved as drafts."),
    h("table", { style: "border-collapse:collapse" }, rows.map(r => h("tr", {}, h("td", { style: "padding:4px 16px 4px 0" }, r[0]), h("td", { style: "font-weight:700" }, String(r[1]))))),
    h("p", { class: "muted" }, "Next: open the admin page, choose \"Drafts only\" in the status filter, check each question, then change its status to Published."),
    h("div", { class: "actions" }, h("a", { class: "btn primary", href: "admin.html" }, "Review the drafts in admin"), again)));
}

(async () => {
  const { data } = await db.auth.getSession();
  if (data.session) start(); else showLogin();
})();
</script>
